:root {
  --button_fill: #fff;
  --button_fill_on: #000;

* { box-sizing: border-box; }

html, body { margin: 0; background: #fff; width: 100%; height: 100%; overflow: hidden; }

body {
  color: var(--text_color);
  font: var(--font_size) "9 Bit RPG", system-ui, sans-serif;
  -webkit-font-smoothing: none;
}

#app {
  position: absolute; top: 0; left: 0;
  width: var(--page_width); height: var(--page_height);
  padding: var(--page_padding);
  transform-origin: 0 0;
  display: flex; flex-direction: column;
}

button, input, select {
  font: inherit; font-size: var(--font_size); color: var(--text_color);
  background: var(--button_fill); border: 1px solid #000;
  padding: 2px 6px; cursor: pointer; border-radius: 4px;
}

button:active { background: #000; color: #fff; }
button:disabled, button:disabled:hover, button:disabled:active { color: #aaa; border-color: #aaa; background: var(--button_fill); cursor: default; }
button.is_on { background: var(--button_fill_on); color: #fff; }

#top_bar {
  flex: none; position: relative; z-index: 10; display: flex; align-items: stretch;
  margin-bottom: 8px; background: #fff; border-bottom: 1px solid #000;
}
.menu { position: relative; display: flex; }
#top_bar button { border: 0; border-radius: 0; background: transparent; color: #000; font-weight: bold; padding: 3px 12px; }
#top_bar button:hover, #top_bar button:active, .menu.is_open > .menu_button { background: #000; color: #fff; }
#top_bar button:disabled, #top_bar button:disabled:hover { background: transparent; color: #aaa; cursor: default; }

.menu_list {
  position: absolute; top: 100%; left: -1px; min-width: calc(100% + 2px);
  display: none; flex-direction: column; background: #fff;
  border: 1px solid #000; box-shadow: 3px 3px 0 #000;
}
.menu.is_open > .menu_list { display: flex; }
.menu_list button { display: flex; justify-content: space-between; gap: 16px; text-align: left; white-space: nowrap; }
.menu_list .key { opacity: 0.6; }
.menu_list button + button { border-top: 1px solid #000; }

#main_area { flex: 0 1 auto; min-height: 0; display: flex; gap: 16px; align-items: stretch; }
#left_panel { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
#right_panel { flex: none; width: 146px; display: flex; flex-direction: column; min-height: 0; }

#message { color: #000; }
#message:empty { display: none; }
.no_file #message { flex: 1; display: flex; align-items: center; justify-content: center; }
#pick_file { font-size: 30px; font-weight: bold; padding: 14px 28px; border-radius: 6px; }
.no_file #top_bar, .no_file #main_area { display: none; }

#layer_rows { flex: 0 1 auto; min-height: 0; overflow-y: auto; padding-right: 4px; }
.layer_row { display: flex; gap: 4px; align-items: center; margin-bottom: 3px; }
.row_group { display: flex; gap: 2px; flex: none; }
.toggle_group { align-self: stretch; }
.toggle_group button { width: 28px; padding: 0; display: flex; align-items: center; justify-content: center; }
.icon_btn svg { display: block; pointer-events: none; }
.icon_btn.is_on .icon_off, .icon_btn:not(.is_on) .icon_on { display: none; }
.force_group { gap: 0; align-self: stretch; }
.force_group button { width: var(--force_button_width); padding: 0; border-radius: 0; display: flex; align-items: center; justify-content: center; }
.force_group button + button { margin-left: -1px; }
.force_group button:first-child { border-radius: 4px 0 0 4px; }
.force_group button:last-child { border-radius: 0 4px 4px 0; }
.step_group { margin-left: auto; }
.step_group button { width: 20px; padding: 2px 0; }

.layer_row .layer_name {

@supports not selector(::-webkit-scrollbar) {

}

<script>
// 16x16 Top Down Character Generator v1.2

// REFERENCES --
const get_element = id => document.getElementById(id);
const preview_canvas = get_element("preview");
const preview_ctx = preview_canvas.getContext("2d");

// CONFIGURATION --
// (Can be modified)
    const SPRITESHEET_URLS = [
      "top-down-character-creator-pack-supporter.aseprite",
      "top-down-character-creator-pack-supporter.ase",
      "top-down-character-creator-pack-demo.aseprite",

    ];
    const frame_width = 16;
    const frame_height = 16;
    const zoom = 8;
    const animation_fps = 4;
    const turn_fps = 8; // rotation speed while holding Turn (mouse / touch on the preview)
    const picker_zoom = 3;
    const disable_saving = false;
    const ANIMATIONS = {
      idle: [
        { source: 1, offset: 1 }, // A
        { source: 1, offset: 0 }, // B
        { source: 1, offset: 1 }  // C
      ],
      walk: [
        { source: 0, offset: 0 },
        { source: 1, offset: 0 },
        { source: 2, offset: 0 }
      ]
    };

    const force_to_front = { ears: 1, eyes: 2, arms: 3 };
    const hide_force_buttons = { eyes: ["up"] };
    // Master palette: used by skin, mouth and hair
    const PALETTE = { 0: "ffffff", 1: "d6d6d6", 2: "999999", 3: "555555", 4: "141414" };
    const palette_5yvalia = [
  ["221125", "441b32", "7e2238", "b42f2f", "e45c3d", "f0913e", "ffc071"],
  ["171631", "412555", "833685", "b13f98", "da55a4", "f68fb4", "e6aad9"],
  ["131d38", "233b64", "3d6497", "539bcc", "7bd1e8", "b3f4f2", "d2ffff"],
  ["15332c", "306850", "3b8c32", "6ea735", "b8de5d", "e5f09d", "e0f8cf"],
  ["493309", "77590d", "b39111", "d4b21d", "f9d52a", "fff460", "ffffd1"],
  ["502a32", "834b43", "bd805c", "d3a17b", "edc6a1", "ffe7b8", "fff2da"],
  ["341925", "662b2b", "934e2a", "d1802a", "f5ac43", "ffd478", "ffffaf"],
  ["080910", "12141c", "191e26", "273037", "454f54", "6a7d7f", "96a4a2"],
  ["bec6c3", "dee4e1", "f3f9f6", null]
];
    // Each part replaces specific gray tones of the master palette (0 = ffffff ... 4 = 141414)
    const PART_TONES = { hair: [0, 2, 3], ears: [0, 2, 3], mouth: [0, 2, 3], arms: [0, 2, 3], body: [0, 2, 3], eyes: [0, 3, 4], skin: [1], outline: [4] };
    const COLOR_PARTS = Object.keys(PART_TONES);
    const LAYER_PARTS = ["hair", "ears", "mouth", "arms", "body", "eyes"]; // only affect the layer with the same name (skin/outline affect all)

    const TOOLTIPS = {
      menu_file: "File",
      menu_export: "Export the spritesheet",
      menu_edit: "Reset or randomize (locked layers are skipped)",
      edit_reset: "Reset all unlocked layers and their colors",
      edit_rand_layers: "Randomize every unlocked layer",
      edit_rand_colors: "Randomize colors of every unlocked layer",
      edit_show_all: "Show / hide every layer",
      edit_lock_all: "Lock / unlock every layer (and Skin / Outline)",
      all_layers: "Skin and outline colors, and a preview of all frames",
      open_pack: "Open an add-on spritesheet (.ase / .aseprite)",
      load_preset: "Load a saved preset",
      save_preset: "Save the current look as a preset",
      export_horizontal: "Export as a horizontal spritesheet",
      export_vertical: "Export as a vertical spritesheet",

      show_layer: "Show / hide this layer",
      lock_layer: "Lock / unlock this layer (Random skips locked layers)",
      layer_name: "Open the thumbnail preview for this layer",
      variant_prev: "Previous variant",
      variant_next: "Next variant",
      variant_number: "Current variant number",

      force_up: "Show in front when facing up",
      force_side: "Show in front when facing left / right",
      force_down: "Show in front when facing down",

      show_all: "Show / hide the All preview",
      lock_all: "Lock / unlock Skin and Outline (Random and Reset skip them)",

      random: "Randomize every unlocked layer",
      reset: "Reset unlocked layers and unlocked colors",

      preview: "Click to turn the character",
      play: "Play / pause the animation",
      anim_mode: "Switch between walk and idle",
      skin: "Change the skin color",
      mouth: "Pick mouth colors (3 tones)",
      lock_color: "Lock / unlock this color (Reset skips locked colors)",
      hair: "Pick hair colors (3 tones)",
      ears: "Pick ears colors (3 tones)",
      eyes: "Pick eyes colors (3 tones)",
      arms: "Pick arms colors (3 tones)",
      body: "Pick body colors (3 tones)",
      outline: "Change the outline (black) color",

      picker_close: "Close the thumbnail preview",  
      variant_thumb: number => "Variant " + number,

      pick_file: "Choose an .ase / .aseprite spritesheet"
    };

// (Do not modify)
    const FRAMES_PER_DIRECTION = 3;
    const VARIANTS_PER_ROW = 30;
    const DIRECTION_ROW_INDEX = { down: 0, left: 1, up: 2 };
    const DIRECTION_CYCLE = ["down", "left", "up", "right"];
    const EXPORT_DIRECTION_ORDER = ["down", "left", "right", "up"];
    const EXPORT_ANIMATION_ORDER = ["idle", "walk"];
    const PINGPONG_SEQUENCE = [0, 1, 2, 1];
    const PICKER_DIRECTION = "down";
    const PICKER_FRAME = 1;
    const FORCE_KEYS = ["up", "side", "down"];
    const FORCE_TIP_KEYS = ["force_up", "force_side", "force_down"];

    const ASEPRITE_MAGIC_NUMBER = 0xA5E0;
    const FILE_HEADER_SIZE = 128;
    const FRAME_HEADER_SIZE = 16;
    const CHUNK_LAYER = 0x2004;
    const CHUNK_CEL = 0x2005;

// STATE --
let layers = [];
let is_playing = true;
let frame_tick = 0;
let last_frame_time = 0;
let direction = "down";
let picker_layer = null;
let picker_all = false;
let all_locked = false;  // lock for the Skin and Outline colors
const new_colors = () => Object.fromEntries(COLOR_PARTS.map(p => [p, Object.fromEntries(PART_TONES[p].map(t => [t, null]))]));
let colors = new_colors(); // colors[part][tone] = null (original) or {row, col}
let popup_target = null;
let current_animation = "walk";

preview_canvas.width = frame_width;
preview_canvas.height = frame_height;
preview_canvas.style.setProperty("--frame_width", frame_width);
preview_canvas.style.setProperty("--frame_height", frame_height);
preview_canvas.style.setProperty("--zoom", zoom);

// -----------------------------------------------------------------------
// FUNCTIONS: ASEPRITE PARSER (RGBA, frame 0 only) --
// -----------------------------------------------------------------------
async function inflate_data(compressed_bytes) {
  const stream = new Blob([compressed_bytes]).stream().pipeThrough(new DecompressionStream("deflate"));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

function hex_to_rgb(hex) {
  return [0, 2, 4].map(offset => parseInt(hex.substr(offset, 2), 16));
}

function sel_hex(sel) { return sel ? palette_5yvalia[sel.row][sel.col] : null; }
function sel_key(sel) { return sel ? sel.row + "." + sel.col : "d"; }

function build_layer_canvas(layer, cols) {
  const cel = layer.cel;
  const pixels = new Uint8ClampedArray(cel.pixels);
  const lname = layer.name.toLowerCase();
  const map = [];
  [...(LAYER_PARTS.includes(lname) ? [lname] : []), "skin", ...(lname === "eyes" ? [] : ["outline"])].forEach(part => {
    if (!cols[part]) return;
    PART_TONES[part].forEach(tone => {
      const sel = cols[part][tone];
      if (sel) map.push([PALETTE[tone], sel_hex(sel)]);
    });
  });
  const pairs = map.map(([from, to]) => ({ from: hex_to_rgb(from), to: hex_to_rgb(to) }));

  if (pairs.length) {
    for (let i = 0; i < pixels.length; i += 4) {
      if (pixels[i + 3] !== 255) continue;
      const hit = pairs.find(p => pixels[i] === p.from[0] && pixels[i + 1] === p.from[1] && pixels[i + 2] === p.from[2]);
      if (hit) { pixels[i] = hit.to[0]; pixels[i + 1] = hit.to[1]; pixels[i + 2] = hit.to[2]; }
    }
  }

  const layer_canvas = document.createElement("canvas");
  layer_canvas.width = layer.canvas_width;
  layer_canvas.height = layer.canvas_height;

  const cel_canvas = document.createElement("canvas");
  cel_canvas.width = cel.width;
  cel_canvas.height = cel.height;
  cel_canvas.getContext("2d").putImageData(new ImageData(pixels, cel.width, cel.height), 0, 0);

  layer_canvas.getContext("2d").drawImage(cel_canvas, cel.x, cel.y);
  return layer_canvas;
}

function get_layer_canvas(layer) {
  const name = layer.name.toLowerCase();
  const key = JSON.stringify([colors.skin, colors.outline, LAYER_PARTS.includes(name) ? colors[name] : 0]);
  if (!layer.canvas_cache[key]) layer.canvas_cache[key] = build_layer_canvas(layer, colors);
  return layer.canvas_cache[key];
}

async function parse_aseprite(buffer) {
  const data_view = new DataView(buffer);
  const bytes = new Uint8Array(buffer);

  if (data_view.getUint16(4, true) !== ASEPRITE_MAGIC_NUMBER) throw new Error("Not an Aseprite file");
  const canvas_width = data_view.getUint16(8, true);
  const canvas_height = data_view.getUint16(10, true);
  const color_depth = data_view.getUint16(12, true);
  if (color_depth !== 32) throw new Error("Only RGBA (32-bit) files are supported");

  let chunk_start = FILE_HEADER_SIZE;
  const chunk_count = data_view.getUint32(chunk_start + 12, true) || data_view.getUint16(chunk_start + 6, true);
  chunk_start += FRAME_HEADER_SIZE;

  const file_layers = [];
  const cels_by_layer = {};

  for (let i = 0; i < chunk_count; i++) {
    const chunk_size = data_view.getUint32(chunk_start, true);
    const chunk_type = data_view.getUint16(chunk_start + 4, true);
    const data_start = chunk_start + 6;

    if (chunk_type === CHUNK_LAYER) {
      const layer_type = data_view.getUint16(data_start + 2, true);
      const name_length = data_view.getUint16(data_start + 16, true);
      const name = new TextDecoder().decode(bytes.subarray(data_start + 18, data_start + 18 + name_length));
      file_layers.push({ name: name, is_image: layer_type === 0 });

    } else if (chunk_type === CHUNK_CEL) {
      const layer_index = data_view.getUint16(data_start, true);
      const cel_x = data_view.getInt16(data_start + 2, true);
      const cel_y = data_view.getInt16(data_start + 4, true);
      const cel_type = data_view.getUint16(data_start + 7, true);

      if (cel_type === 0 || cel_type === 2) {
        const cel_width = data_view.getUint16(data_start + 16, true);
        const cel_height = data_view.getUint16(data_start + 18, true);
        let pixels = bytes.subarray(data_start + 20, chunk_start + chunk_size);
        if (cel_type === 2) pixels = await inflate_data(pixels);
        cels_by_layer[layer_index] = { x: cel_x, y: cel_y, width: cel_width, height: cel_height, pixels: pixels };
      }
    }

    chunk_start += chunk_size;
  }

  return file_layers.map((file_layer, index) => {
    const cel = cels_by_layer[index];
    if (!file_layer.is_image || !cel) return null;

    const layer = { index: index, name: file_layer.name, cel: cel, canvas_width: canvas_width, canvas_height: canvas_height, canvas_cache: {} };
    layer.canvas = build_layer_canvas(layer, {});
    return layer;
  }).filter(Boolean);
}

function count_variants(layer_canvas) {
  const pixel_data = layer_canvas.getContext("2d").getImageData(0, 0, layer_canvas.width, layer_canvas.height).data;

  const has_pixels = (area_x, area_y, area_width, area_height) => {
    for (let y = area_y; y < Math.min(area_y + area_height, layer_canvas.height); y++) {
      for (let x = area_x; x < Math.min(area_x + area_width, layer_canvas.width); x++) {
        if (pixel_data[(y * layer_canvas.width + x) * 4 + 3]) return true;
      }
    }
    return false;
  };

  let start_row = 0;
  while ((start_row + 1) * frame_height <= layer_canvas.height
         && !has_pixels(0, start_row * frame_height, layer_canvas.width, frame_height)) {
    start_row++;
  }

  let row_count = 0;
  while ((start_row + row_count + 1) * frame_height <= layer_canvas.height
         && has_pixels(0, (start_row + row_count) * frame_height, layer_canvas.width, frame_height)) {
    row_count++;
  }
  if (row_count === 0) return { variant_count: 1, offset_y: 0 };

  let last_variant = 0;
  for (let column = 0; column < VARIANTS_PER_ROW; column++) {
    const column_x = column * FRAMES_PER_DIRECTION * frame_width;
    if (has_pixels(column_x, (start_row + row_count - 1) * frame_height, FRAMES_PER_DIRECTION * frame_width, frame_height)) {
      last_variant = column;
    }
  }

  return {
    variant_count: (row_count - 1) * VARIANTS_PER_ROW + last_variant + 1,
    offset_y: start_row * frame_height
  };
}

// -----------------------------------------------------------------------
// FUNCTIONS: RENDERING --
// -----------------------------------------------------------------------
function draw_layer_variant(ctx, layer, variant_index, facing, frame, dest_x, dest_y) {
  const is_mirrored = facing === "right";
  const direction_row = DIRECTION_ROW_INDEX[is_mirrored ? "left" : facing];

  const rows_per_direction = Math.ceil(layer.variant_count / VARIANTS_PER_ROW);
  const source_x = ((variant_index % VARIANTS_PER_ROW) * FRAMES_PER_DIRECTION + frame) * frame_width;
  const variant_row = Math.floor(variant_index / VARIANTS_PER_ROW);
  const source_y = layer.offset_y + (direction_row * (rows_per_direction + 1) + variant_row) * frame_height;

  ctx.save();
  if (is_mirrored) {
    ctx.translate(dest_x + frame_width, dest_y);
    ctx.scale(-1, 1);
    ctx.drawImage(get_layer_canvas(layer), source_x, source_y, frame_width, frame_height, 0, 0, frame_width, frame_height);
  } else {
    ctx.drawImage(get_layer_canvas(layer), source_x, source_y, frame_width, frame_height, dest_x, dest_y, frame_width, frame_height);
  }
  ctx.restore();
}

function draw_character(ctx, animation, facing, frame, dest_x, dest_y) {
  const key = facing === "left" || facing === "right" ? "side" : facing;
  const rank = layer => force_to_front[layer.name.toLowerCase()];
  const is_forced = layer => rank(layer) !== undefined && layer.force[key];
  const frame_data = ANIMATIONS[animation][frame];

  const ordered = [
    ...layers.filter(layer => !is_forced(layer)),
    ...layers.filter(is_forced).sort((a, b) => rank(a) - rank(b))
  ];

  ctx.save();
  ctx.beginPath();
  ctx.rect(dest_x, dest_y, frame_width, frame_height);
  ctx.clip();

  for (const layer of ordered) {
    if (!layer.is_visible) continue;
    const offset = layer === layers[0] ? 0 : frame_data.offset;
    draw_layer_variant(ctx, layer, layer.variant_index, facing, frame_data.source, dest_x, dest_y + offset);
  }

  ctx.restore();
}

function render_preview() {
  preview_ctx.clearRect(0, 0, frame_width, frame_height);
  draw_character(preview_ctx, current_animation, direction, PINGPONG_SEQUENCE[frame_tick % PINGPONG_SEQUENCE.length], 0, 0);
}

function run_animation_loop(time) {
  if (is_playing && time - last_frame_time >= 1000 / animation_fps) {
    last_frame_time = time;
    frame_tick++;
    render_preview();
  }
  requestAnimationFrame(run_animation_loop);
}

function set_tip(element, key, ...args) {
  const entry = TOOLTIPS[key];
  const tip = typeof entry === "function" ? entry(...args) : entry;
  if (tip === undefined) return;
  if (!element.textContent.trim()) element.setAttribute("aria-label", tip);
}

function apply_tooltips() {
  document.querySelectorAll("[data-tip]").forEach(element => set_tip(element, element.dataset.tip));
}

function create_icon_button(icon_on, icon_off, tip_key, on_click, is_on) {
  const button = document.createElement("button");
  button.className = "icon_btn";
  button.innerHTML = icon_off
    ? icon_on.replace("<svg ", '<svg class="icon_on" ') + icon_off.replace("<svg ", '<svg class="icon_off" ')
    : icon_on;
  button.onclick = on_click;
  if (is_on) button.classList.add("is_on");
  set_tip(button, tip_key);
  return button;
}

function create_button(label, on_click, is_on, tip_key) {
  const button = document.createElement("button");
  button.textContent = label;
  button.onclick = on_click;
  if (is_on) button.classList.add("is_on");
  if (tip_key) set_tip(button, tip_key);
  return button;
}

function step_variant(layer, step) {
  layer.variant_index = (layer.variant_index + step + layer.variant_count) % layer.variant_count;
  refresh_ui();
}

function build_layer_rows() {
  const layer_rows = get_element("layer_rows");
  layer_rows.innerHTML = "";
  close_variant_picker();

  [...layers].reverse().forEach(layer => {
    const row = document.createElement("div");
    row.className = "layer_row";

    const show_button = create_icon_button(ICON_EYE_OPEN, ICON_EYE_CLOSED, "show_layer", () => { layer.is_visible = !layer.is_visible; refresh_ui(); }, layer.is_visible);
    const lock_button = create_icon_button(ICON_LOCK_CLOSED, ICON_LOCK_OPEN, "lock_layer", () => { layer.is_locked = !layer.is_locked; refresh_ui(); }, layer.is_locked);
    const has_force = force_to_front[layer.name.toLowerCase()] !== undefined;
    const force_buttons = FORCE_KEYS.map((key, i) => {
      const force_icon = [ICON_ARROW_UP, ICON_ARROW_SIDE, ICON_ARROW_DOWN][i];
      const button = create_icon_button(force_icon, null, FORCE_TIP_KEYS[i], () => { layer.force[key] = !layer.force[key]; refresh_ui(); }, layer.force[key]);
      if (!has_force || (hide_force_buttons[layer.name.toLowerCase()] || []).includes(key)) button.style.visibility = "hidden";
      return button;
    });
    const previous_button = create_button("<", () => step_variant(layer, -1), false, "variant_prev");
    const next_button = create_button(">", () => step_variant(layer, 1), false, "variant_next");

    const name_label = document.createElement("div");
    name_label.className = "layer_name";
    name_label.textContent = layer.name;
    name_label.onclick = () => toggle_variant_picker(layer);
    set_tip(name_label, "layer_name");

    const variant_label = document.createElement("div");
    variant_label.className = "variant_label";
    set_tip(variant_label, "variant_number");

    layer.controls = { show_button: show_button, lock_button: lock_button, force_buttons: force_buttons, name_label: name_label, variant_label: variant_label };
    const make_group = (class_name, ...children) => {
      const group = document.createElement("div");
      group.className = "row_group " + class_name;
      group.append(...children);
      return group;
    };
    row.append(
      make_group("toggle_group", show_button, lock_button),
      name_label,
      make_group("step_group", previous_button, variant_label, next_button),
      make_group("force_group", ...force_buttons)
    );
    layer_rows.append(row);
  });

  refresh_ui();
}

function refresh_ui() {
  for (const layer of layers) {
    layer.controls.show_button.classList.toggle("is_on", layer.is_visible);
    layer.controls.lock_button.classList.toggle("is_on", layer.is_locked);
    layer.controls.force_buttons.forEach((button, i) => button.classList.toggle("is_on", layer.force[FORCE_KEYS[i]]));
    layer.controls.name_label.classList.toggle("is_on", layer === picker_layer);
    layer.controls.variant_label.textContent = String(layer.variant_index + 1);
  }

  get_element("all_name").classList.toggle("is_on", picker_all);
  if (picker_layer) {
    [...get_element("picker_grid").children].forEach((thumbnail_button, variant_index) => {
      thumbnail_button.classList.toggle("is_selected", variant_index === picker_layer.variant_index);
    });
  } else if (picker_all) {
    render_all_preview();
  }
  [...get_element("picker_tones").children].forEach(b => {
    b.querySelector(".swatch").style.background = "#" + (sel_hex(colors[b.dataset.part][b.dataset.tone]) || PALETTE[b.dataset.tone]);
  });
  get_element("lock_all").classList.toggle("is_on", all_locked);
  render_preview();
}

// Every frame of the current animation: 4 directions x 3 frames, 6 images per row
const ALL_PREVIEW_DIRECTIONS = ["down", "left", "right", "up"];
const ALL_PREVIEW_PER_ROW = 6;

function render_all_preview() {
  const picker_grid = get_element("picker_grid");
  picker_grid.innerHTML = "";
  picker_grid.classList.add("all_mode");

  const frames = [];
  ALL_PREVIEW_DIRECTIONS.forEach(facing => {
    for (let frame = 0; frame < FRAMES_PER_DIRECTION; frame++) frames.push([facing, frame]);
  });
  const row_count = Math.ceil(frames.length / ALL_PREVIEW_PER_ROW);

  const gap = 4, pad = 3;
  const size = Math.max(16, Math.min(
    (picker_grid.clientHeight - pad * 2 - gap * (row_count - 1)) / row_count,
    (picker_grid.clientWidth - pad * 2 - gap * (ALL_PREVIEW_PER_ROW - 1)) / ALL_PREVIEW_PER_ROW
  ));

  for (let r = 0; r < row_count; r++) {
    const row = document.createElement("div");
    row.className = "all_row";
    frames.slice(r * ALL_PREVIEW_PER_ROW, (r + 1) * ALL_PREVIEW_PER_ROW).forEach(([facing, frame]) => {
      const thumbnail = document.createElement("canvas");
      thumbnail.width = frame_width;
      thumbnail.height = frame_height;
      thumbnail.style.width = size + "px";
      thumbnail.style.height = size * frame_height / frame_width + "px";
      draw_character(thumbnail.getContext("2d"), current_animation, facing, frame, 0, 0);
      row.append(thumbnail);
    });
    picker_grid.append(row);
  }
}

function toggle_variant_picker(layer) {
  picker_layer = layer;
  picker_all = false;
  get_element("picker_title").textContent = layer.name;
  const part = LAYER_PARTS.includes(layer.name.toLowerCase()) ? layer.name.toLowerCase() : "";
  fill_tones(part ? PART_TONES[part].map(tone => ({ part: part, tone: tone })) : []);

  const picker_grid = get_element("picker_grid");
  picker_grid.innerHTML = "";
  picker_grid.classList.remove("all_mode");

  for (let variant_index = 0; variant_index < layer.variant_count; variant_index++) {
    const thumbnail = document.createElement("canvas");
    thumbnail.width = frame_width;
    thumbnail.height = frame_height;
    thumbnail.style.width = frame_width * picker_zoom + "px";
    thumbnail.style.height = frame_height * picker_zoom + "px";
    draw_layer_variant(thumbnail.getContext("2d"), layer, variant_index, PICKER_DIRECTION, PICKER_FRAME, 0, 0);

    const thumbnail_button = document.createElement("button");
    thumbnail_button.className = "variant_thumb";
    set_tip(thumbnail_button, "variant_thumb", variant_index + 1);
    thumbnail_button.onclick = () => { layer.variant_index = variant_index; refresh_ui(); };
    thumbnail_button.append(thumbnail);
    picker_grid.append(thumbnail_button);
  }

  get_element("variant_picker").hidden = false;
  refresh_ui();

  picker_grid.children[layer.variant_index]?.scrollIntoView({ block: "nearest" });
}

function open_color_popup(part, tone) {
  popup_target = { part: part, tone: tone };
  get_element("popup_title").textContent = part + (PART_TONES[part].length > 1 ? " " + (PART_TONES[part].indexOf(tone) + 1) : "");
  const grid = get_element("popup_grid");
  grid.innerHTML = "";
  const current = sel_key(colors[part][tone]);
  palette_5yvalia.forEach((row, r) => row.forEach((hex, c) => {
    const b = document.createElement("button");
    b.className = "color_swatch";
    b.style.gridRow = (r % 5) + 1;
    b.style.gridColumn = r < 5 ? c + 1 : c + 9;
    const pick = sel => { colors[part][tone] = sel; close_color_popup(); refresh_colors(); };
    if (hex) {
      b.style.background = "#" + hex;
      b.dataset.key = r + "." + c;
      b.onclick = () => pick({ row: r, col: c });
    } else {
      b.classList.add("is_default");
      b.textContent = "x";
      b.dataset.key = "d";
      b.onclick = () => pick(null);
    }
    b.classList.toggle("is_selected", b.dataset.key === current);
    grid.append(b);
  }));
  get_element("color_popup").hidden = false;
}

function close_color_popup() {
  popup_target = null;
  get_element("color_popup").hidden = true;
}

    const layer = layers.find(l => l.name.toLowerCase() === part);
    return !!(layer && layer.is_locked);
  }
  return all_locked; // skin / outline follow the lock of the "All" entry
};
const rand_int = n => Math.floor(Math.random() * n);
const TONE_COL = { 0: 5, 1: 4, 2: 3, 3: 2, 4: 0 };

function random_part_colors(part) {
  const row = rand_int(8);
  const out = {};
  PART_TONES[part].forEach(tone => {
    if (part === "skin") out[tone] = { row: 5, col: 2 + rand_int(4) };
    else if (part === "eyes" && tone === 0) out[tone] = { row: 8, col: rand_int(3) };
    else if (part === "eyes") out[tone] = { row: row, col: TONE_COL[tone] }; // tones 3 and 4 share one hue
    else if (part === "outline") out[tone] = { row: rand_int(8), col: 0 };
    else out[tone] = { row: row, col: TONE_COL[tone] };
  });
  return out;
}

get_element("edit_show_all").onclick = () => {
  const show = !layers.every(layer => layer.is_visible);
  layers.forEach(layer => layer.is_visible = show);
  refresh_ui();
};

get_element("edit_lock_all").onclick = () => {
  const lock = !(all_locked && layers.every(layer => layer.is_locked));
  all_locked = lock;
  layers.forEach(layer => layer.is_locked = lock);
  refresh_ui();
};

function refresh_colors() {
  const open_layer = picker_layer;
  if (open_layer) { close_variant_picker(); toggle_variant_picker(open_layer); }
  else if (picker_all) toggle_all_picker();
  else refresh_ui();
}

get_element("color_popup").onclick = event => { if (event.target.id === "color_popup") close_color_popup(); };
document.addEventListener("keydown", event => { if (event.key === "Escape") close_color_popup(); });

get_element("anim_mode").onclick = event => {
  current_animation = current_animation === "walk" ? "idle" : "walk";
  event.target.textContent = current_animation === "walk" ? "Walk" : "Idle";
  refresh_ui();
};

get_element("play").onclick = event => {
  is_playing = !is_playing;
  event.target.textContent = is_playing ? "Pause" : "Play";
  event.target.classList.toggle("is_on", is_playing);
};

let turn_timer = null;

function turn_once() {
  direction = DIRECTION_CYCLE[(DIRECTION_CYCLE.indexOf(direction) + 1) % DIRECTION_CYCLE.length];
  render_preview();
}

function start_turning() {
  if (turn_timer !== null) return;
  turn_once(); // a quick tap turns once
  turn_timer = setInterval(turn_once, 1000 / turn_fps); // holding keeps turning at a fixed rate
}

function stop_turning() {
  clearInterval(turn_timer);
  turn_timer = null;
}

preview_canvas.onpointerdown = event => { event.preventDefault(); start_turning(); };
window.addEventListener("pointerup", stop_turning);
window.addEventListener("pointercancel", stop_turning);
window.addEventListener("blur", stop_turning);

// -----------------------------------------------------------------------
// FUNCTIONS: PRESETS --
// -----------------------------------------------------------------------
get_element("save").disabled = disable_saving;
get_element("load").disabled = disable_saving;

get_element("save").onclick = () => {
  const preset = {
    parts: {},
    hidden: layers.filter(layer => !layer.is_visible).map(layer => layer.name.toLowerCase()),
    force: {},
    colors: Object.fromEntries(COLOR_PARTS.map(p => [p, Object.fromEntries(PART_TONES[p].map(t => [t, colors[p][t] || "grayscale"]))]))
  };
  layers.forEach(layer => {
    preset.parts[layer.name.toLowerCase()] = layer.variant_index;
    if (force_to_front[layer.name.toLowerCase()] !== undefined) preset.force[layer.name.toLowerCase()] = { ...layer.force };
  });

  download_file(new Blob([JSON.stringify(preset, null, 2)], { type: "application/json" }), "preset.json");
};

get_element("load").onclick = () => get_element("preset_file").click();

get_element("preset_file").onchange = async event => {
  const file = event.target.files[0];
  if (!file) return;

  try {
    const preset = JSON.parse(await file.text());
    const valid = s => (s && Number.isInteger(s.row) && Number.isInteger(s.col) && palette_5yvalia[s.row]?.[s.col]) ? { row: s.row, col: s.col } : null;
    const loaded = new_colors();
    COLOR_PARTS.forEach(p => PART_TONES[p].forEach(t => loaded[p][t] = valid(preset.colors?.[p]?.[t])));
    colors = loaded;
    layers.forEach(layer => {
      const key = layer.name.toLowerCase();
      if (Number.isInteger(preset.parts?.[key])) {
        layer.variant_index = Math.min(layer.variant_count - 1, Math.max(0, preset.parts[key]));
      }
      layer.is_visible = !(preset.hidden || []).includes(key);
      FORCE_KEYS.forEach(force_key => layer.force[force_key] = !!preset.force?.[key]?.[force_key]);
    });
    get_element("message").textContent = "";
    refresh_colors();
  } catch {
    get_element("message").textContent = "Invalid preset file.";
  }

  event.target.value = "";
};

// -----------------------------------------------------------------------
// FUNCTIONS: EXPORT (Idle + Walk, Down, Left, Right, Up x 3 frames) --
// -----------------------------------------------------------------------
function export_spritesheet(is_vertical) {
  const direction_count = EXPORT_DIRECTION_ORDER.length;
  const animation_count = EXPORT_ANIMATION_ORDER.length;

  const export_canvas = document.createElement("canvas");
  export_canvas.width = frame_width * FRAMES_PER_DIRECTION * (is_vertical ? animation_count : direction_count);
  export_canvas.height = frame_height * (is_vertical ? direction_count : animation_count);
  const export_ctx = export_canvas.getContext("2d");

  EXPORT_ANIMATION_ORDER.forEach((animation, animation_index) => {
    EXPORT_DIRECTION_ORDER.forEach((facing, direction_index) => {
      for (let frame = 0; frame < FRAMES_PER_DIRECTION; frame++) {
        const dest_x = is_vertical
          ? (animation_index * FRAMES_PER_DIRECTION + frame) * frame_width
          : (direction_index * FRAMES_PER_DIRECTION + frame) * frame_width;
        const dest_y = is_vertical ? direction_index * frame_height : animation_index * frame_height;
        draw_character(export_ctx, animation, facing, frame, dest_x, dest_y);
      }
    });
  });

  export_canvas.toBlob(blob => download_file(blob, "spritesheet.png"));
}

get_element("export_h").onclick = () => export_spritesheet(false);
get_element("export_v").onclick = () => export_spritesheet(true);

function download_file(blob, file_name) {
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = file_name;

  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(link.href), 1000);
}

// -----------------------------------------------------------------------
// FUNCTIONS: LOAD SPRITESHEET --
// -----------------------------------------------------------------------
async function load_spritesheet(buffer) {
  try {
    const image_layers = await parse_aseprite(buffer);
    if (!image_layers.length) throw new Error("No image layers found");

    layers = image_layers
      .sort((a, b) => a.index - b.index)
      .map(layer => ({
        ...layer,
        ...count_variants(layer.canvas),
        variant_index: 0,
        is_visible: true,
        is_locked: false,
        force: { up: false, side: false, down: false }
      }));

    get_element("message").textContent = "";
    document.body.classList.remove("no_file");
    build_layer_rows();

    toggle_variant_picker(layers[layers.length - 1]);
  } catch (error) {
    show_file_picker();
  }
}

function show_file_picker() {
  document.body.classList.add("no_file");
  get_element("message").innerHTML = '<button id="pick_file">Choose .ase file</button>';
  set_tip(get_element("pick_file"), "pick_file");
  get_element("pick_file").onclick = () => get_element("spritesheet_file").click();
}

get_element("spritesheet_file").onchange = async event => {
  if (event.target.files[0]) load_spritesheet(await event.target.files[0].arrayBuffer());
};

// -----------------------------------------------------------------------
// KEYBOARD SHORTCUTS --
// -----------------------------------------------------------------------
const SHORTCUTS = {
  "1": "edit_reset",
  "2": "edit_rand_layers",
  "3": "edit_rand_colors",
  "4": "edit_show_all",
  "5": "edit_lock_all",
  "s": "save",
  "o": "load"
};

document.addEventListener("keydown", event => {
  if (event.ctrlKey || event.metaKey || event.altKey || event.repeat) return;
  if (document.body.classList.contains("no_file")) return;
  if (!get_element("color_popup").hidden) return;
  if (event.key.toLowerCase() === "r") { // hold R to rotate at a fixed speed
    event.preventDefault();
    close_menus();
    start_turning();
    return;
  }
  const target = SHORTCUTS[event.key.toLowerCase()];
  if (!target) return;
  event.preventDefault();
  close_menus();
  get_element(target).click(); // disabled buttons (e.g. saving off) ignore this
});

document.addEventListener("keyup", event => { if (event.key.toLowerCase() === "r") stop_turning(); });

// make sure the embed receives key presses
window.addEventListener("load", () => window.focus());
document.addEventListener("pointerdown", () => window.focus());

// -----------------------------------------------------------------------
// FULLSCREEN / WINDOW SCALING --
// -----------------------------------------------------------------------
const app_element = get_element("app");
const BASE_WIDTH = 480;
const BASE_HEIGHT = 400;
let fit_retries = 0;

function fit_app() {
  const vv = window.visualViewport;
  const w = (vv && vv.width) || window.innerWidth || document.documentElement.clientWidth;
  const h = (vv && vv.height) || window.innerHeight || document.documentElement.clientHeight;

  if (!w || !h) {
    if (fit_retries++ < 60) requestAnimationFrame(fit_app);
    return;
  }
  fit_retries = 0;

  const scale = Math.min(w / BASE_WIDTH, h / BASE_HEIGHT);
  const offset_x = (w - BASE_WIDTH * scale) / 2;
  const offset_y = (h - BASE_HEIGHT * scale) / 2;
  app_element.style.transform = "translate(" + offset_x + "px, " + offset_y + "px) scale(" + scale + ")";
}

function fit_app_settled() {
  fit_app();
  setTimeout(fit_app, 100);
  setTimeout(fit_app, 300);
}

window.addEventListener("resize", fit_app_settled);
window.addEventListener("orientationchange", fit_app_settled);
window.addEventListener("pageshow", fit_app_settled);
window.addEventListener("load", fit_app_settled);
document.addEventListener("fullscreenchange", fit_app_settled);
document.addEventListener("webkitfullscreenchange", fit_app_settled);
if (window.visualViewport) window.visualViewport.addEventListener("resize", fit_app_settled);
fit_app_settled();

// -----------------------------------------------------------------------
// START UP --
// -----------------------------------------------------------------------
apply_tooltips();

async function fetch_first_available(urls) {
  for (const url of urls) {
    try {
      const response = await fetch(url);
      if (!response.ok) continue;
      const buffer = await response.arrayBuffer();
      if (buffer.byteLength > FILE_HEADER_SIZE && new DataView(buffer).getUint16(4, true) === ASEPRITE_MAGIC_NUMBER) {
        return buffer;
      }
    } catch {}
  }
  throw new Error("File not found");
}

fetch_first_available(SPRITESHEET_URLS)
  .then(load_spritesheet)
  .catch(() => show_file_picker());

requestAnimationFrame(run_animation_loop);
</script>
